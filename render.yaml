# The database is deliberately NOT declared here, for the same reason as
# human-anomaly-detection-backend: Render's free managed databases expire, and
# a workspace may only hold one. Render also has no MySQL at all — only
# Postgres — and this app needs genuine MySQL 8.
#
# Why MySQL 8 specifically and not a MySQL-compatible service: the booking
# transaction in src/config/booking.php locks with
# `SELECT ... FOR UPDATE OF m`, which is 8.0.1+ syntax that TiDB- and
# Vitess-backed offerings do not reliably support — and that lock is the whole
# point of the project. The schema also relies on CHECK constraints actually
# being enforced.
#
# Aiven's free MySQL plan is real MySQL 8. Create one, then set the DB_*
# variables below on the service.
#
# Do not read "free plan" as "permanent": the first one vanished overnight on
# 2026-08-11 — the hostname stopped resolving, which is what Aiven does when a
# service is powered off or deleted. If the demo goes dark, check that the
# database is still there before looking anywhere else. README.md lists the
# three places the connection details have to be re-pointed.
#
# The container initialises its own schema on first boot (docker-entrypoint.sh
# runs db/bootstrap.php, which is a no-op once the tables exist), so there is no
# manual migration step after deploying.

services:
  - type: web
    name: stadium-booking
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    # Pinned rather than left to the default. Every page load makes several
    # round trips to the database, so the two want to be close: the demo
    # database is Aiven's free MySQL in DigitalOcean San Francisco, and
    # `oregon` is the nearest region Render offers (its US options are Oregon,
    # Ohio and Virginia — there is no California). Same coast, ~20ms.
    # Moving a Render service between regions means recreating it.
    region: oregon
    # Not /index.php. That page calls db() before it renders anything, so when
    # the demo database went away the health check failed forever, the service
    # never went live, and requests hung without a status instead of showing an
    # error. /health.php answers 200 whenever PHP is serving and reports the
    # database separately.
    healthCheckPath: /health.php
    envVars:
      # Render terminates TLS at its load balancer and forwards plain HTTP, so
      # without this the app emits http:// links on an https:// site and drops
      # the Secure flag off the session cookie.
      - key: TRUST_PROXY
        value: "1"

      # Hides the demo-credentials hint on the login page.
      - key: APP_ENV
        value: production

      # Pins the scheme+host used to build absolute links. Without it url()
      # falls back to the client-supplied Host header — which was a working
      # open redirect until redirect() stopped emitting absolute URLs. Belt
      # and braces: this also keeps canonical links correct.
      - key: APP_BASE_URL
        value: https://stadium-booking-75sm.onrender.com

      # Aiven connection details — set these in the dashboard, not here.
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false

      # Path to Aiven's CA bundle inside the container. Add the certificate as
      # a Secret File named ca.pem in the Render dashboard; Render mounts secret
      # files at /etc/secrets/. Leave unset to connect without verifying the
      # server certificate, which defeats the point of the TLS.
      - key: DB_SSL_CA
        value: /etc/secrets/ca.pem
