  <!-- Pitch, cropped by the frame so the touchline curves out of shot. -->
  <ellipse cx="200" cy="215" rx="272" ry="108" fill="url(#pitch)"/>
  <g fill="none" stroke="#eaf5ee" stroke-width="2" opacity=".45">
