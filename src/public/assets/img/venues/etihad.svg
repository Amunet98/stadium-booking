<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" role="img" aria-label="Etihad Stadium">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1116"/>
      <stop offset="1" stop-color="#304c62"/>
    </linearGradient>
    <radialGradient id="beam" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff8e1" stop-opacity=".28"/>
      <stop offset="1" stop-color="#fff8e1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pitch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#184533"/>
      <stop offset="1" stop-color="#133329"/>
    </linearGradient>
  </defs>

  <rect width="400" height="225" fill="url(#sky)"/>
  <g><ellipse cx="52" cy="34" rx="54" ry="40" fill="url(#beam)"/><rect x="49.5" y="40" width="5" height="72" fill="#203342"/><rect x="30" y="16" width="44" height="26" rx="4" fill="#203342"/><g fill="#fdf6e3"><circle cx="37" cy="26" r="2.6"/><circle cx="47" cy="26" r="2.6"/><circle cx="57" cy="26" r="2.6"/><circle cx="67" cy="26" r="2.6"/><circle cx="37" cy="35" r="2.6"/><circle cx="47" cy="35" r="2.6"/><circle cx="57" cy="35" r="2.6"/><circle cx="67" cy="35" r="2.6"/></g></g>
  <g><ellipse cx="348" cy="34" rx="54" ry="40" fill="url(#beam)"/><rect x="345.5" y="40" width="5" height="72" fill="#203342"/><rect x="326" y="16" width="44" height="26" rx="4" fill="#203342"/><g fill="#fdf6e3"><circle cx="333" cy="26" r="2.6"/><circle cx="343" cy="26" r="2.6"/><circle cx="353" cy="26" r="2.6"/><circle cx="363" cy="26" r="2.6"/><circle cx="333" cy="35" r="2.6"/><circle cx="343" cy="35" r="2.6"/><circle cx="353" cy="35" r="2.6"/><circle cx="363" cy="35" r="2.6"/></g></g>

  <!-- Far stand: roof line, then the crowd behind it. -->
