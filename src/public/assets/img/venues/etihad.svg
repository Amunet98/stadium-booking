  <path d="M0 66 L400 66 L400 60 L0 60 Z" fill="#3b4b59"/>
  <g fill="#34526a" opacity=".85">
    <rect x="18" y="74" width="26" height="9" rx="2.5"/>
    <rect x="50" y="74" width="26" height="9" rx="2.5"/>
    <rect x="82" y="74" width="26" height="9" rx="2.5"/>
